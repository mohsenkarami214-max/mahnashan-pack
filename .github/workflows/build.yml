
name: Build Mahnashan Pack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q ./*.zip -d extracted

      - name: Locate Flutter project
        run: |
          PROJECT=$(find extracted -name pubspec.yaml -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Flutter project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Generate Android project files
        run: |
          cd "$PROJECT_DIR"
          rm -rf android
          flutter create --platforms=android --org com.mahnashan.pack --project-name mahnashan_pack .

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahnashan-Pack-APK
          path: extracted/mahnashan_pack_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
