name: Build Mahnashan Pack APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q ./*.zip -d extracted

      - name: Find Flutter project
        run: |
          PROJECT=$(find extracted -name pubspec.yaml -print -quit)
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      -       - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/gradle-8.4/gradle-8.14/g' android/gradle/wrapper/gradle-wrapper.properties
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahnashan-Pack-APK
          path: extracted/**/build/app/outputs/flutter-apk/app-release.apk
